<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>체스 엔진 — 대국</title>
    <link rel="stylesheet" href="./css/board.css" />
  </head>
  <body>
    <main class="page">
      <h1>체스 엔진</h1>

      <div class="board-area">
        <div id="board" class="board" role="grid" aria-label="체스판"></div>
        <p id="status" class="status" role="status" aria-live="polite">백 차례</p>
        <div class="controls">
          <button type="button" id="new-game">새 게임</button>
          <button type="button" id="undo">무르기</button>
          <button type="button" id="flip">보드 뒤집기</button>
          <label class="control-toggle">
            <input type="checkbox" id="engine-toggle" />
            엔진이 흑
          </label>
          <label class="control-toggle">
            깊이
            <select id="engine-depth">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </label>
        </div>
      </div>

      <aside class="panel">
        <section>
          <h2>기보</h2>
          <ol id="moves" class="moves" aria-label="수 기록">
            <li class="moves-empty">아직 둔 수가 없습니다.</li>
          </ol>
        </section>

        <section>
          <h2>분석</h2>
          <div class="eval">
            <strong id="eval-score" class="eval-score">0.00</strong>
            <span class="eval-note">백 기준 · 폰</span>
          </div>
          <div class="eval-bar" role="img" aria-label="평가 막대">
            <span id="eval-fill" class="eval-fill"></span>
          </div>
          <p id="move-counts" class="move-counts">캡처 0 · 체크 0 · 승격 0</p>
          <div class="engine">
            <button type="button" id="engine-hint">추천 수</button>
            <span id="engine-line" class="engine-line">—</span>
          </div>
          <ul id="candidates" class="candidates" aria-label="후보수"></ul>
        </section>

        <section>
          <h2>국면</h2>
          <dl class="meta">
            <dt>차례</dt>
            <dd id="turn">백</dd>
            <dt>합법수</dt>
            <dd id="legal-count">20</dd>
            <dt>FEN</dt>
            <dd id="fen">-</dd>
          </dl>
        </section>

        <p class="note">
          기물을 클릭해 집고, 표시된 칸을 클릭해 둡니다. 후보수를 클릭해도 그대로 둘 수
          있습니다. 패널의 평가 점수는 기물 가치 합이고, 엔진 점수는 위치 점수까지
          더해 탐색한 결과입니다.
        </p>
      </aside>
    </main>

    <div id="promotion" class="promotion" hidden>
      <div class="promotion-card" role="dialog" aria-modal="true" aria-label="프로모션 선택">
        <h2>승격할 기물</h2>
        <div id="promotion-choices" class="promotion-choices"></div>
        <button type="button" id="promotion-cancel" class="promotion-cancel">취소</button>
      </div>
    </div>

    <script type="module" src="./js/ui.js"></script>
  </body>
</html>
